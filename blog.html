<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Opening S+ Academy Blog</title>
</head>
<body>
  <p>The blog is part of the S+ Academy home page. <a id="blogLink" href="index.html#blog">Open the S+ Academy blog</a>.</p>
  <script>
    const article = new URLSearchParams(window.location.search).get("post");
    const destination = article
      ? `index.html#blog/${encodeURIComponent(article)}`
      : "index.html#blog";
    document.getElementById("blogLink").href = destination;
    window.location.replace(destination);
  </script>
</body>
</html>
