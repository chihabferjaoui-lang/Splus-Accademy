<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Choose a new password for your S+ Academy account.">
  <title>Reset Password | S+ Academy</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <header class="portal-header">
    <a class="portal-brand" href="index.html">
      <img src="assets/logo.png" alt="">
      <span>S+ Academy</span>
    </a>
    <nav class="portal-header-links" aria-label="Account navigation">
      <a href="student-login.html">Student login</a>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <main class="portal-shell">
    <section class="portal-card auth-card" aria-labelledby="reset-title">
      <p class="portal-note">Secure account recovery</p>
      <h1 class="portal-heading" id="reset-title">Choose a new password</h1>
      <p class="portal-subtitle">Use the secure link sent to the email address on your account.</p>
      <div class="portal-message" data-reset-message role="status" aria-live="polite">Checking your password reset link…</div>
      <form class="auth-form" data-new-password-form hidden>
        <label>New password (at least 8 characters)
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>Confirm new password
          <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit">Update password</button>
      </form>
      <a class="portal-button" data-login-link href="student-login.html" hidden>Return to sign in</a>
    </section>
  </main>

  <script src="js/supabase-config.js"></script>
  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
